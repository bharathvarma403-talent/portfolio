<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#030712" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#core-grad)" stroke-width="2" stroke-opacity="0.4" />
  <polygon points="50,18 80,35 80,65 50,82 20,65 20,35" stroke="url(#core-grad)" stroke-width="3.5" fill="none" filter="url(#glow)" />
  <circle cx="50" cy="50" r="10" fill="url(#core-grad)" filter="url(#glow)" />
  <text x="50" y="55" font-family="'Syne', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">PBV</text>
</svg>